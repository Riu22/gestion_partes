spring.application.name=gestion_partes

# --- CONFIGURACION DE CONEXION ---
# Si existe la variable en el entorno, la usa. Si no, apunta a localhost
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.your-tenant-id}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your-super-secret-and-long-postgres-password}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- SEGURIDAD Y JWT ---
jwt.secret=${JWT_SECRET:your-super-secret-jwt-token-with-at-least-32-characters-long}

# --- SUPABASE API ---
# En Docker usaremos el nombre del servicio, en local localhost
# URL interna Docker para subir al bucket (backend -> supabase)
supabase.url=${SUPABASE_URL:http://localhost:8000}
# URL pública externa para que la app móvil lea las imágenes
supabase.public.url=${SUPABASE_PUBLIC_URL:http://localhost:8000}
supabase.service.key=${SUPABASE_SERVICE_KEY:eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q}

# --- SERVER ---
server.port=${SERVER_PORT:8081}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:INFO}

# --- JACKSON ---
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.fail-on-empty-beans=false

# --- APK ---
app.version.actual=1.0.15
app.apk.url=http://gestion-partes.duckdns.org:/storage/v1/object/public/instaladores/app-release.apk


# =====================================================================
# MEJORAS DE RENDIMIENTO PARA CARGA PESADA (NUEVO)
# =====================================================================

# 1. OPTIMIZACIÓN DEL POOL DE CONEXIONES (HIKARICP)
# Sube el límite de 10 a 30 conexiones para procesar más peticiones en paralelo
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:30}
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=1800000

# 2. COMPRESIÓN DE RESPUESTAS (GZIP)
# Comprime el JSON masivo al vuelo reduciendo drásticamente el uso de ancho de banda de red
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/xml,text/css
server.compression.min-response-size=2048

# 3. INFRAESTRUCTURA DE CACHÉ
# Deja listo el entorno por si usar @Cacheable en los servicios
spring.cache.type=simple