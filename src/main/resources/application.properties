# =====================================================================
# RENDIMIENTO
# =====================================================================

# 1. HIKARICP ? Pool de conexiones
#
# maximum-pool-size: máximo de conexiones abiertas simultáneamente.
#   Con las queries paralelas del contabilidad_service se abren hasta 3
#   conexiones por petición. 10 es suficiente para uso normal; 20 para picos.
#   Supabase free/pro tiene límite de conexiones: no subas sin verificarlo.
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:10}

# minimum-idle: conexiones que se mantienen vivas aunque no haya carga.
#   Con 2 ya hay conexiones calientes para las primeras peticiones del día
#   sin desperdiciar conexiones del límite de Supabase.
spring.datasource.hikari.minimum-idle=2

# idle-timeout: tiempo antes de cerrar una conexión idle por encima del mínimo.
#   MÍNIMO RECOMENDADO POR HIKARICP: 10 minutos (600000 ms).
#   Con 10000 ms (10 s) las conexiones se destruyen y recrean continuamente,
#   añadiendo ~100-200 ms de latencia a cada petición tras un momento de calma.
spring.datasource.hikari.idle-timeout=600000

# max-lifetime: tiempo máximo de vida de una conexión antes de renovarla.
#   Debe ser varios minutos menor que el timeout del servidor (Supabase/pgBouncer
#   cierra conexiones idle a los ~10 min). 1800000 ms = 30 min está bien.
spring.datasource.hikari.max-lifetime=1800000

# connection-timeout: tiempo máximo esperando una conexión libre del pool.
#   Si todas las conexiones están ocupadas y tarda más de 3 s en liberar una,
#   falla rápido en lugar de dejar la petición colgada.
spring.datasource.hikari.connection-timeout=3000

# keepalive-time: envía un ping periódico para mantener vivas las conexiones idle.
#   Evita que el firewall/pgBouncer de Supabase corte conexiones silenciosamente.
#   Debe ser menor que idle-timeout. 60000 ms = 1 minuto.
spring.datasource.hikari.keepalive-time=60000


# 2. COMPRESIÓN DE RESPUESTAS (GZIP)
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/xml,text/css
server.compression.min-response-size=2048


# 3. CACHÉ
spring.cache.type=simple