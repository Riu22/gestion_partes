spring.application.name=gestion_partes

# --- CONFIGURACIÓN DE CONEXIÓN ---
# Si el pooler (Supavisor) está activo, EXIGE el tenant id en el usuario
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres.your-tenant-id
spring.datasource.password=your-super-secret-and-long-postgres-password
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / HIBERNATE ---
# Importante: 'none' evita que Hibernate intente validar antes de conectar
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- SEGURIDAD Y JWT ---
jwt.secret=your-super-secret-jwt-token-with-at-least-32-characters-long

# --- SUPABASE API ---
