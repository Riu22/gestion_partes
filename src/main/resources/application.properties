spring.application.name=gestion_partes

# --- CONFIGURACIÓN DE BASE DE DATOS ---
# VIEJO (Localhost): spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
# NUEVO: Usa la variable DB_URL de Koyeb. Si no existe, intenta localhost.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}

# VIEJO: spring.datasource.username=postgres.your-tenant-id
# NUEVO: El usuario completo de Supabase (ej: postgres.vshhacbcnwigvlvgqpej)
spring.datasource.username=${DB_USER:postgres.your-tenant-id}

# VIEJO: spring.datasource.password=your-super-secret-and-long-postgres-password
# NUEVO: Tu contraseña real de Supabase
spring.datasource.password=${DB_PASSWORD:your-super-secret-and-long-postgres-password}

spring.datasource.driver-class-name=org.postgresql.Driver

# --- HIBERNATE / JPA ---
# VIEJO: spring.jpa.hibernate.ddl-auto=none
# NUEVO: 'update' es vital para que Spring cree las tablas en la base de datos vacía de Supabase
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
# --- CONFIGURACIÓN SUPABASE (API/AUTH) ---
# VIEJO: supabase.url=http://localhost:8000
# NUEVO: La URL de tu proyecto (https://vshhacbcnwigvlvgqpej.supabase.co)
supabase.url=${SUPABASE_URL:http://localhost:8000}

# VIEJO: supabase.service.key=eyJhbGciOiJIUzI1NiIsInR5c... (Local Key)
# NUEVO: Tu 'service_role' key real de Supabase Settings > API
supabase.service.key=${SUPABASE_KEY:tu-clave-aqui}

# --- SEGURIDAD / JWT ---
# VIEJO: jwt.secret=your-super-secret-jwt-token...
# NUEVO: El 'JWT Secret' que aparece en el panel de Supabase API
jwt.secret=${JWT_SECRET:your-super-secret-jwt-token-with-at-least-32-characters-long}

# --- SERVIDOR ---
# VIEJO: server.port=8081
# NUEVO: Koyeb asigna un puerto dinámico (PORT). Si no, usa 8080 (el estándar de Docker)
server.port=${PORT:8081}

# --- OTROS ---
logging.level.org.springframework.security=DEBUG
spring.jackson.property-naming-strategy=SNAKE_CASE