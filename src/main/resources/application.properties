spring.application.name=gestion_partes
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=riu
spring.datasource.password=admin1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8000/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8000/auth/v1/jwks