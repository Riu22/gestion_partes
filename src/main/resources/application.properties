spring.application.name=gestion_partes

# --- CONFIGURACION DE BASE DE DATOS ---
# VIEJO (Localhost): spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
# NUEVO: Usa la variable DB_URL de Koyeb. Si no existe, intenta localhost.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}

# VIEJO: spring.datasource.username=postgres.your-tenant-id
# NUEVO: El usuario completo de Supabase (ej: postgres.id)
spring.datasource.username=${DB_USER:postgres.your-tenant-id}

# VIEJO: spring.datasource.password=password
# NUEVO: Tu contrasena real de Supabase
spring.datasource.password=${DB_PASSWORD:your-super-secret-password}

spring.datasource.driver-class-name=org.postgresql.Driver

# --- HIBERNATE / JPA ---
# VIEJO: spring.jpa.hibernate.ddl-auto=none
# NUEVO: update es vital para que Spring cree las tablas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# --- CONFIGURACION SUPABASE (API/AUTH) ---
# VIEJO: supabase.url=http://localhost:8000
# NUEVO: La URL de tu proyecto
supabase.url=${SUPABASE_URL:http://localhost:8000}

# VIEJO: supabase.service.key=key-local
# NUEVO: Tu service_role key real de Supabase
supabase.service.key=${SUPABASE_KEY:tu-clave-aqui}

# --- SEGURIDAD / JWT ---
# VIEJO: jwt.secret=secret
# NUEVO: El JWT Secret que aparece en el panel de Supabase
jwt.secret=${JWT_SECRET:your-super-secret-jwt-token-with-at-least-32-characters-long}

# --- SERVIDOR ---
# VIEJO: server.port=8081
# NUEVO: Koyeb asigna un puerto dinamico (PORT). Si no, usa 8081
server.port=${PORT:8081}

# --- OTROS ---
logging.level.org.springframework.security=DEBUG
spring.jackson.property-naming-strategy=SNAKE_CASE